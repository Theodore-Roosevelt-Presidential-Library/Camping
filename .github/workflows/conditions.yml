name: Refresh conditions

on:
  schedule:
    - cron: '41 */6 * * *'   # every six hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: conditions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot conditions
        run: python collector/conditions.py
      - name: Commit if changed
        run: |
          git config user.name "camping-bot"
          git config user.email "camping-bot@users.noreply.github.com"
          git add docs/data/conditions.json
          git diff --cached --quiet || git commit -m "Refresh conditions"
          git pull --rebase --quiet || true
          git push
      - name: Open an issue when Forest Service orders change
        if: hashFiles('orders-changed.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Forest Service orders changed: check the /visit/camping page" --body-file orders-changed.md
