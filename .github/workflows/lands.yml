name: Refresh land records

on:
  schedule:
    - cron: '23 9 * * 1'   # Mondays, 09:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild land layers
        run: python collector/lands.py
      - name: Commit if changed
        run: |
          git config user.name "camping-bot"
          git config user.email "camping-bot@users.noreply.github.com"
          git add docs/data/lands.json docs/data/sites.json docs/data/roads.json docs/data/counties.json docs/data/meta.json
          git diff --cached --quiet || git commit -m "Refresh land records"
          git push
